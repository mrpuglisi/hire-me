<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-labelledby="t d">
  <title id="t">Project details available on request</title>
  <desc id="d">A blurred, generic dashboard outline behind a card with a lock icon that reads: Project details available on request. Contact me to learn more.</desc>
  <defs>
    <filter id="blur" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="1600" height="500" rx="32" fill="#F4F6F9"/>

  <!-- generic blurred dashboard shapes -->
  <g filter="url(#blur)" opacity=".8">
    <rect x="60" y="50" width="1480" height="56" rx="12" fill="#D5DCE5"/>
    <rect x="60" y="130" width="340" height="96" rx="14" fill="#FFFFFF"/>
    <rect x="420" y="130" width="340" height="96" rx="14" fill="#FFFFFF"/>
    <rect x="780" y="130" width="340" height="96" rx="14" fill="#FFFFFF"/>
    <rect x="1140" y="130" width="400" height="96" rx="14" fill="#FFFFFF"/>
    <rect x="60" y="250" width="720" height="210" rx="14" fill="#FFFFFF"/>
    <rect x="800" y="250" width="740" height="210" rx="14" fill="#FFFFFF"/>
    <g fill="#9ED3CC">
      <rect x="110" y="390" width="48" height="40"/><rect x="180" y="360" width="48" height="70"/><rect x="250" y="330" width="48" height="100"/>
      <rect x="320" y="350" width="48" height="80"/><rect x="390" y="310" width="48" height="120"/><rect x="460" y="300" width="48" height="130"/>
      <rect x="530" y="280" width="48" height="150"/><rect x="600" y="295" width="48" height="135"/><rect x="670" y="275" width="48" height="155"/>
    </g>
    <path d="M860 420 C 960 330, 1060 380, 1160 320 S 1360 300, 1480 290" fill="none" stroke="#F2A08A" stroke-width="10"/>
  </g>

  <!-- message card -->
  <g font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="490" y="135" width="620" height="230" rx="26" fill="#FFFFFF" stroke="#D5DCE5" stroke-width="2"/>
    <g transform="translate(800 196)">
      <circle r="34" fill="#E3F4F1"/>
      <rect x="-15" y="-4" width="30" height="24" rx="5" fill="#1B2A4A"/>
      <path d="M-9 -4 V-12 a9 9 0 0 1 18 0 V-4" fill="none" stroke="#1B2A4A" stroke-width="5"/>
    </g>
    <text x="800" y="275" font-size="34" font-weight="800" fill="#1F2937">Project details on request</text>
    <text x="800" y="320" font-size="26" fill="#2A7F75" font-weight="600">Contact me to learn more</text>
  </g>
</svg>
