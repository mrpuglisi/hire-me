<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t d">
  <title id="t">Open vulnerabilities cut by ~90%</title>
  <desc id="d">A bar chart showing open security vulnerabilities cut by ~90%, with the three steps in between: fix the reporting, map which fixes unblock others, and divide the work across teams. FedRAMP authorization was kept.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5B6B7F"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="750" rx="36" fill="#F4F6F9"/>
  <text x="70" y="88" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#5B6B7F">OPEN SECURITY VULNERABILITIES</text>

  <!-- baseline -->
  <line x1="70" y1="620" x2="1130" y2="620" stroke="#C9D1DB" stroke-width="3"/>

  <!-- start bar: starting point = 100% -->
  <rect x="110" y="170" width="190" height="450" rx="10" fill="#E76F51"/>
  <text x="205" y="150" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#1F2937">Before</text>
  <text x="205" y="666" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#5B6B7F">At risk</text>

  <!-- end bar: ~10% of starting point (same scale) -->
  <rect x="900" y="575" width="190" height="45" rx="10" fill="#2A9D8F"/>
  <text x="995" y="556" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#1F2937">~90% fewer</text>
  <text x="995" y="666" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#5B6B7F">Well within SLAs</text>

  <!-- the three steps -->
  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <rect x="350" y="200" width="500" height="84" rx="16" fill="#FFFFFF" stroke="#D5DCE5" stroke-width="2"/>
    <circle cx="396" cy="242" r="24" fill="#1B2A4A"/>
    <text x="396" y="251" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">1</text>
    <text x="436" y="236" font-size="24" font-weight="700" fill="#1F2937">Fix the reporting first</text>
    <text x="436" y="266" font-size="19" fill="#5B6B7F">Duplicates made overdue look twice as bad</text>

    <rect x="350" y="312" width="500" height="84" rx="16" fill="#FFFFFF" stroke="#D5DCE5" stroke-width="2"/>
    <circle cx="396" cy="354" r="24" fill="#1B2A4A"/>
    <text x="396" y="363" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">2</text>
    <text x="436" y="348" font-size="24" font-weight="700" fill="#1F2937">Map the dependencies</text>
    <text x="436" y="378" font-size="19" fill="#5B6B7F">Which fixes unblock or close the most</text>

    <rect x="350" y="424" width="500" height="84" rx="16" fill="#FFFFFF" stroke="#D5DCE5" stroke-width="2"/>
    <circle cx="396" cy="466" r="24" fill="#1B2A4A"/>
    <text x="396" y="475" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">3</text>
    <text x="436" y="460" font-size="24" font-weight="700" fill="#1F2937">Divide the work</text>
    <text x="436" y="490" font-size="19" fill="#5B6B7F">Each team owned a clear set of fixes</text>
  </g>

  <!-- arrow from start to end -->
  <path d="M310 560 C 520 600, 700 600, 885 595" fill="none" stroke="#5B6B7F" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#ah)"/>

  <!-- shield badge -->
  <g transform="translate(905 190)">
    <path d="M90 0 L170 30 L170 110 C170 170, 130 210, 90 230 C50 210, 10 170, 10 110 L10 30 Z" fill="#1B2A4A"/>
    <path d="M55 115 L80 140 L128 88" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="268" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2937">FedRAMP</text>
    <text x="90" y="296" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2937">authorization kept</text>
  </g>
</svg>
